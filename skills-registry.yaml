defaults:
  git: https://github.com/sciknow-io/alhazen-skill-examples
  ref: main
skills:
- name: alhazen-core
  path: skills/alhazen-core
- name: agent-os
  path: skills/agent-os
- name: agentic-memory
  path: skills/agentic-memory
  dashboard:
    enabled: true
    name: Alhazen Notebook
    description: "Browse the knowledge graph \u2014 schema, entities, roles, relations,\
      \ and agent session history."
    url_path: /agentic-memory
    icon: Brain
    color: teal
- name: typedb-notebook
  path: skills/typedb-notebook
- name: web-search
  path: skills/web-search
- name: curation-skill-builder
  path: skills/curation-skill-builder
  dashboard:
    enabled: false
    name: Domain Modeling
    description: Track skill design processes, decisions, gaps, and experiments across
      all knowledge domains.
    url_path: /curation-skill-builder
    icon: Layers
    color: violet
- name: scientific-literature
  git: https://github.com/sciknow-io/alhazen-skill-deep-research
  ref: main
  subdir: skills/scientific-literature
  dashboard:
    enabled: true
    name: Scientific Literature
    description: Corpora, paper embeddings, and faceting pipelines.
    url_path: /scientific-literature
    icon: BookOpen
    color: cyan
- name: tech-recon
  git: https://github.com/sciknow-io/alhazen-skill-deep-research
  ref: main
  subdir: skills/tech-recon
  dashboard:
    enabled: true
    name: Tech Recon
    description: Goal-driven technology investigation with dynamic Observable Plot
      analysis.
    url_path: /tech-recon
    icon: Search
    color: cyan
- name: dismech-notebook
  git: https://github.com/sciknow-io/alhazen-skill-deep-research
  ref: main
  subdir: skills/dismech-notebook
  dashboard:
    enabled: true
    name: DisMech Notebook
    description: Rare disease mechanism knowledge mapped into Alhazen notebook memory.
    url_path: /dismech
    icon: Dna
    color: teal
- name: literature-trends
  git: https://github.com/sciknow-io/alhazen-skill-deep-research
  ref: main
  subdir: skills/literature-trends
- name: coach
  git: https://github.com/sciknow-io/alhazen-skill-personal-assistant
  ref: main
  subdir: skills/coach
  dashboard:
    enabled: true
    name: Health Coach
    description: "Personal health & fitness monitoring \u2014 metrics, sleep, workouts,\
      \ goals, appointments."
    url_path: /coach
    icon: Heart
    color: teal
- name: career
  git: https://github.com/sciknow-io/alhazen-skill-personal-assistant
  ref: executive-team
  subdir: skills/career
  dashboard:
    enabled: true
    name: Career
    description: "The career graph: people, collaborators, projects, and the opportunity pipeline."
    url_path: /career
    icon: Briefcase
    color: blue
- name: analyst
  git: https://github.com/sciknow-io/alhazen-skill-personal-assistant
  ref: executive-team
  subdir: skills/analyst
  dashboard:
    enabled: true
    name: Research Analyst
    description: Decision-framed research missions with multi-thread consensus and the three-question gate.
    url_path: /analyst
    icon: Microscope
    color: cyan
- name: advisor
  git: https://github.com/sciknow-io/alhazen-skill-personal-assistant
  ref: executive-team
  subdir: skills/advisor
  dashboard:
    enabled: true
    name: Board of Advisors
    description: Strategic decisions debated by advisor personas, with bias checks and scenario stress-tests.
    url_path: /advisor
    icon: Scale
    color: teal
- name: scribe
  git: https://github.com/sciknow-io/alhazen-skill-personal-assistant
  ref: executive-team
  subdir: skills/scribe
  dashboard:
    enabled: true
    name: Scribe
    description: "Writing in your voice: profiles, audience personas, and dimension-scored drafts."
    url_path: /scribe
    icon: PenTool
    color: mint
- name: ops
  git: https://github.com/sciknow-io/alhazen-skill-personal-assistant
  ref: executive-team
  subdir: skills/ops
  dashboard:
    enabled: true
    name: Operations
    description: Morning briefs, stakeholder CRM, meeting prep, commitments, and monitors.
    url_path: /ops
    icon: Gauge
    color: rust
- name: chief-of-staff
  git: https://github.com/sciknow-io/alhazen-skill-personal-assistant
  ref: executive-team
  subdir: skills/chief-of-staff
  dashboard:
    enabled: true
    name: Chief of Staff
    description: "Cross-skill daily agenda: what needs you today across the whole team."
    url_path: /chief
    icon: LayoutDashboard
    color: teal

- 01_investigation
- 22_grounding_policy
idempotent: true
source_match: 'match $i isa scilit-investigation, has id "scinv-3e0aa419866c"; (parent-note: $i, child-note: $pp) isa alh-note-threading; $pp isa scilit-grounding-policy; fetch { "f_iid": $i.id, "f_pid": $pp.id };'

- 19_citation_impacts
idempotent: true
source_match: 'match $i isa scilit-investigation, has id "scinv-3e0aa419866c"; (parent-note: $i, child-note: $im) isa alh-note-threading; $im isa scilit-citation-impact; fetch { "f_iid": $i.id, "f_mid": $im.id };'
